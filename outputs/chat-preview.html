<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
:root{
  --surface:#fff; --surface2:#f4f6f9; --surface3:oklch(92% 0.01 250);
  --border:#e5e8ee; --text:#1f2430; --text-muted:#8a8f9c; --text-hint:oklch(65% 0.015 250);
  --accent:oklch(54% 0.18 248); --accent-hover:oklch(48% 0.18 248);
  --radius:10px; --radius-lg:14px; --radius-xl:18px;
}
body{margin:0;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--surface2)}
.phone{width:390px;height:700px;background:var(--surface);display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.12)}
.chat-head{padding:14px 16px;border-bottom:0.5px solid var(--border);font-size:15px;font-weight:600}
.messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;margin-top:2px;overflow:hidden}
.avatar.ai{background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:#fff;box-shadow:0 2px 8px -2px color-mix(in srgb,var(--accent) 45%,transparent)}
.avatar.ai svg{width:22px;height:22px;display:block}
.avatar .av-img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.user-av{background:var(--surface3);color:var(--text-muted);border:0.5px solid var(--border)}
.bubble{max-width:min(80%,480px);padding:10px 14px;border-radius:var(--radius-xl);font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.ai .bubble{background:var(--surface);border:0.5px solid var(--border);border-top-left-radius:4px;color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.04)}
.msg.user .bubble{background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:#fff;border-top-right-radius:4px;box-shadow:0 2px 8px -3px color-mix(in srgb,var(--accent) 40%,transparent)}
.bubble.streaming .typing-content::after{content:'▍';color:var(--accent);margin-left:1px;animation:caret .9s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.typing-indicator{display:flex;gap:4px;align-items:center;padding:12px 14px}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
.input-area{background:var(--surface);border-top:0.5px solid var(--border);padding:12px 16px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.input-area textarea{flex:1;min-height:40px;max-height:160px;resize:none;background:var(--surface2);border:0.5px solid var(--border);border-radius:var(--radius);padding:9px 12px;font-size:13.5px;line-height:1.5;overflow-y:auto;font-family:inherit}
.input-area textarea:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);outline:none}
.send-btn{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent-hover));border:none;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 2px 8px -2px color-mix(in srgb,var(--accent) 45%,transparent)}
.send-btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="phone">
  <div class="chat-head">AI 访谈</div>
  <div class="messages" id="m"></div>
  <div class="input-area">
    <textarea placeholder="输入你的回答…">上个月那单就是老客户介绍的</textarea>
    <div class="send-btn"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></div>
  </div>
</div>
<script>
const AI_AVATAR_SVG = `
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path fill="currentColor" d="M4.2 18.2 Q4.2 11.2 12.8 11.2 Q20.6 11.2 22.6 15.4 L25.2 11.8 Q26.2 10.6 26 12.2 L25.4 16.4 Q25.3 17.4 25.5 18.6 L26.2 23 Q26.4 24.6 25.3 23.4 L22.8 20.8 Q20.4 24.8 12.8 24.8 Q4.2 24.8 4.2 18.2 Z"/>
  <circle cx="9.4" cy="16.6" r="1.45" fill="var(--accent)"/>
  <path d="M5.5 20.6 Q7 21.8 8.9 21.5" stroke="var(--accent)" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.55"/>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M9.8 9 V6.6"/>
    <path d="M12.6 8.2 Q14.4 7.4 15 5.6"/>
  </g>
</svg>`;
const AV = AI_AVATAR_SVG;
function add(html){const d=document.createElement('div');d.className='msg '+html[0];d.innerHTML=html[1];document.getElementById('m').appendChild(d);}
add(['ai',`<div class="avatar ai">${AV}</div><div class="bubble">您好，我是本次访谈的 AI 顾问。今天想跟您聊聊最近成交的一单，把您做对的地方挖出来，全程 15–30 分钟，不用准备任何材料。\n\n先从一个好聊的开始：最近这单客户，您是怎么接触到他的？</div>`]);
add(['user',`<div class="avatar user-av">我</div><div class="bubble">上个月那单就是老客户介绍的，人特别爽快，聊了两次就签了。</div>`]);
add(['ai',`<div class="avatar ai">${AV}</div><div class="bubble">老客户转介绍能两次就签，说明信任是现成的。我想挖一下您做对了什么：第一次见面，您开口第一句说的是什么？</div>`]);
add(['ai',`<div class="avatar ai">${AV}</div><div class="bubble streaming"><span class="typing-content">您提到客户「爽快」，这背后一般</span></div>`]);
add(['ai',`<div class="avatar ai">${AV}</div><div class="bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`]);
</script>
</body></html>

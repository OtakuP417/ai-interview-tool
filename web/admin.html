<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访谈案例归档 · 管理端</title>
<style>
:root {
  --bg: oklch(98.5% 0.003 250);
  --surface: oklch(100% 0 0);
  --surface2: oklch(97% 0.004 250);
  --surface3: oklch(94.5% 0.005 250);
  --border: oklch(88% 0.01 250);
  --border-strong: oklch(80% 0.015 250);
  --text: oklch(18% 0.02 250);
  --text-muted: oklch(48% 0.02 250);
  --text-hint: oklch(65% 0.015 250);
  --accent: oklch(54% 0.18 248);
  --accent-hover: oklch(48% 0.18 248);
  --accent-light: oklch(95% 0.06 248);
  --accent-text: oklch(36% 0.14 248);
  --success: oklch(52% 0.16 158);
  --success-light: oklch(95% 0.05 158);
  --danger: oklch(52% 0.18 20);
  --danger-light: oklch(96% 0.05 20);
  --warning-light: oklch(96% 0.06 75);
  --warning-text: oklch(40% 0.16 75);
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  min-height: 100vh; font-size: 14px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; }

/* ── 登录 ── */
#login-view {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
}
.login-card {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius-xl); padding: 32px 28px;
  width: 100%; max-width: 380px;
}
.login-card h1 { font-size: 17px; font-weight: 500; margin-bottom: 6px; }
.login-card p { font-size: 12.5px; color: var(--text-muted); margin-bottom: 22px; }
.login-card input {
  width: 100%; background: var(--surface2); border: 0.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px;
  color: var(--text); outline: none; letter-spacing: 2px;
}
.login-card input:focus { border-color: var(--accent); background: var(--surface); }
.login-card button {
  width: 100%; margin-top: 16px; background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius); padding: 11px 16px;
  font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s;
}
.login-card button:hover { background: var(--accent-hover); }
.login-card button:disabled { opacity: .55; cursor: not-allowed; }
.login-err {
  display: none; margin-top: 12px; padding: 9px 12px; font-size: 12.5px;
  background: var(--danger-light); color: var(--danger);
  border: 0.5px solid oklch(82% .1 20); border-radius: var(--radius-sm);
}
.build-stamp {
  margin-top: 14px; text-align: center;
  font-size: 11.5px; color: var(--text-hint); letter-spacing: .2px;
}

/* ── 主视图 ── */
#main-view { display: none; }
.topbar {
  background: var(--surface); border-bottom: 0.5px solid var(--border);
  padding: 12px 20px; display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 20;
}
.topbar .title { font-size: 15px; font-weight: 500; }
.topbar .sub { font-size: 12px; color: var(--text-muted); }
.topbar .spacer { flex: 1; }
.ghost-btn {
  background: none; border: 0.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 6px 12px; font-size: 12.5px; color: var(--text-muted);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.ghost-btn:hover { color: var(--text); border-color: var(--border-strong); }
.primary-btn {
  background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius-sm); padding: 7px 14px; font-size: 12.5px;
  font-weight: 500; cursor: pointer; transition: background .15s; white-space: nowrap;
}
.primary-btn:hover { background: var(--accent-hover); }

.wrap { max-width: 1180px; margin: 0 auto; padding: 20px; }

.filters {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 16px;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
}
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11.5px; color: var(--text-hint); }
.field input, .field select {
  background: var(--surface2); border: 0.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 7px 10px; font-size: 13px;
  color: var(--text); outline: none; min-width: 130px;
}
.field input:focus, .field select:focus { border-color: var(--accent); background: var(--surface); }
.field.grow { flex: 1; min-width: 200px; }
.field.grow input { width: 100%; }

/* ── AI 主题/标签搜索框 ──────────────────────────────────────
   与「关键词」的区别：关键词搜的是原始录入字段（主题原文/姓名/UM），
   这里搜的是 AI 提炼出来的 ai_topic 与 tags。语义不同，所以分开两个框，
   用户不会误以为「搜不到就是没有」。 */
.field.search-field { min-width: 260px; }
.lbl-tag {
  display: inline-block; margin-left: 4px; padding: 0 5px;
  font-size: 10px; line-height: 14px; border-radius: 4px;
  background: var(--accent); color: #fff; vertical-align: 1px;
}
.search-box { position: relative; display: flex; align-items: center; }
.search-icon {
  position: absolute; left: 9px; width: 14px; height: 14px;
  fill: none; stroke: var(--text-hint); stroke-width: 2;
  stroke-linecap: round; pointer-events: none;
}
.search-box input {
  width: 100%; padding-left: 29px; padding-right: 28px;
}
.search-clear {
  position: absolute; right: 6px; width: 18px; height: 18px;
  border: none; border-radius: 50%; cursor: pointer;
  background: var(--surface3); color: var(--text-muted);
  font-size: 10px; line-height: 18px; padding: 0;
}
.search-clear:hover { background: var(--border-strong); color: var(--text); }
.search-hint { font-size: 11px; color: var(--text-hint); margin-top: 2px; }
.search-hint.warn { color: var(--warning-text); }
/* 结果里标出「为什么命中」：是标签命中还是 AI 主题命中 */
.hit-on {
  background: #FFE9A8; border-radius: 3px; padding: 0 2px;
  color: var(--text); font-weight: 500;
}
.hit-badge {
  display: inline-block; margin-left: 6px; padding: 0 6px;
  font-size: 10.5px; line-height: 15px; border-radius: 4px;
  background: var(--accent); color: #fff; vertical-align: 1px; white-space: nowrap;
}
.hit-badge.tag { background: var(--success); }
.hit-tags { margin-top: 4px; }
.hit-tags .tag-chip { font-size: 11px; padding: 1px 7px; margin: 0 4px 4px 0; }

.stats { font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; }

table { width: 100%; border-collapse: collapse; background: var(--surface); }
.tbl-wrap {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
}
thead th {
  background: var(--surface2); font-size: 11.5px; font-weight: 500;
  color: var(--text-muted); text-align: left; padding: 10px 12px;
  border-bottom: 0.5px solid var(--border); white-space: nowrap;
}
tbody td {
  padding: 11px 12px; font-size: 13px; border-bottom: 0.5px solid var(--border);
  vertical-align: top;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr { cursor: pointer; transition: background .12s; }
tbody tr:hover { background: var(--accent-light); }
td.nowrap { white-space: nowrap; color: var(--text-muted); font-size: 12.5px; }
td.topic { max-width: 300px; }
td.topic .ell {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
/* AI 归纳主题：口述主题下方的副行，与原文形成对照 */
.ai-topic-line {
  margin-top: 3px; font-size: 11.5px; color: var(--accent);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.ai-topic-line.hint { color: var(--text-hint); font-style: normal; }
/* 标签 chip：固定词表内取值用浅底，自由词用虚线框提示待归并 */
.tag-chip {
  display: inline-block; padding: 2px 8px; margin: 0 5px 5px 0;
  border-radius: 99px; font-size: 11.5px; white-space: nowrap;
  background: var(--accent-light); color: var(--accent);
}
.tag-chip.free {
  background: var(--warning-light); color: var(--warning-text);
  border: 1px dashed var(--warning-text);
}
.tag-row { line-height: 1.9; }
.pill {
  display: inline-block; padding: 2px 9px; border-radius: 99px;
  font-size: 11.5px; white-space: nowrap;
}
.pill.wait { background: var(--warning-light); color: var(--warning-text); }
.pill.adopt { background: var(--success-light); color: var(--success); }
.pill.reject { background: var(--danger-light); color: var(--danger); }
.pill.ok { background: var(--success-light); color: var(--success); }
.meta-hint { font-size: 11.5px; color: var(--text-hint); margin-left: 6px; }
.field-warn {
  font-size: 11px; color: var(--warning-text); background: var(--warning-light);
  padding: 1px 6px; border-radius: 4px; margin-left: 6px; white-space: nowrap;
}
.empty { padding: 48px 20px; text-align: center; color: var(--text-hint); font-size: 13px; }

/* ── 编辑基础信息面板 ── */
.edit-panel {
  background: var(--surface); border: 0.5px solid var(--border-strong);
  border-radius: var(--radius-lg); padding: 14px 16px; margin-top: 16px;
}
.edit-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.edit-head strong { font-size: 13.5px; }
.edit-note { font-size: 11.5px; color: var(--text-hint); }
.edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
@media (max-width: 560px) { .edit-grid { grid-template-columns: 1fr; } }
.edit-field { display: flex; flex-direction: column; gap: 4px; }
.edit-label { font-size: 11.5px; color: var(--text-muted); }
.edit-label em { font-style: normal; color: var(--text-hint); }
.edit-input {
  width: 100%; padding: 7px 10px; font-size: 13px; font-family: inherit;
  color: var(--text); background: var(--bg);
  border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm);
}
.edit-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.edit-foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.edit-msg { font-size: 12px; color: var(--text-hint); }
.edit-msg.ok { color: var(--success); }
.edit-msg.err { color: var(--danger); }
.save-btn {
  padding: 7px 16px; font-size: 13px; font-family: inherit; cursor: pointer;
  color: #fff; background: var(--accent); border: none; border-radius: var(--radius-sm);
}
.save-btn:hover { background: var(--accent-hover); }
.save-btn:disabled { opacity: .6; cursor: default; }

/* ── 报告正文编辑 ── */
.rep-edited-banner {
  background: var(--warning-light); color: var(--warning-text);
  border: 0.5px solid var(--warning-text); border-radius: var(--radius-sm);
  padding: 8px 12px; font-size: 12.5px; margin-bottom: 14px; line-height: 1.6;
}
.rep-editor { width: 100%; box-sizing: border-box; }
.rep-editor textarea {
  width: 100%; box-sizing: border-box; min-height: 460px; resize: vertical;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12.5px; line-height: 1.7; padding: 12px 14px;
  background: var(--surface); color: var(--text);
  border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm);
}
.rep-editor textarea:focus { outline: none; border-color: var(--accent); }
.rep-editor-tip {
  font-size: 11.5px; color: var(--text-hint); line-height: 1.7;
  margin-bottom: 8px;
}
.rep-editor-tip code {
  background: var(--accent-light); color: var(--accent);
  padding: 1px 5px; border-radius: 3px; font-size: 11.5px;
}
.rep-editor-stat { font-size: 12px; }
.rep-editor-stat.bad { color: var(--danger); font-weight: 500; }
.rep-editor-stat.good { color: var(--success); }

/* ── AI 辅助修改 ── */
.ai-note {
  background: var(--accent-light); color: var(--accent-text);
  border-radius: var(--radius-sm); padding: 8px 11px;
  font-size: 11.5px; line-height: 1.75; margin-bottom: 11px;
}
.ai-mode { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 9px; font-size: 12.5px; }
.ai-mode label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text-muted); }
.ai-mode label.on { color: var(--accent); font-weight: 500; }
.ai-secs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
.ai-secs label {
  display: flex; align-items: center; gap: 4px; font-size: 12px;
  border: 0.5px solid var(--border-strong); border-radius: 999px;
  padding: 3px 10px; cursor: pointer; color: var(--text-muted);
  background: var(--bg);
}
.ai-secs label.on { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.ai-input-row { display: flex; gap: 8px; align-items: stretch; }
.ai-input {
  flex: 1; min-height: 64px; resize: vertical; padding: 8px 11px;
  font-size: 13px; line-height: 1.65; font-family: inherit;
  background: var(--bg); color: var(--text);
  border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm);
}
.ai-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.ai-examples { font-size: 11.5px; color: var(--text-hint); line-height: 1.9; margin-top: 7px; }
.ai-examples b { color: var(--text-muted); font-weight: 500; }
.ai-examples span {
  cursor: pointer; border-bottom: 1px dashed var(--border-strong);
  margin-right: 9px; color: var(--accent-text);
}
.ai-examples span:hover { border-bottom-color: var(--accent); }
.ai-log { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.ai-turn {
  font-size: 12.5px; line-height: 1.75; padding: 6px 10px;
  border-radius: var(--radius-sm); white-space: pre-wrap; word-break: break-word;
}
.ai-turn.u { background: var(--surface3); }
.ai-turn.a { background: var(--accent-light); color: var(--accent-text); }
.ai-turn.e { background: var(--danger-light); color: var(--danger); }
.ai-diff { margin-top: 14px; border-top: 0.5px solid var(--border); padding-top: 13px; }
.ai-diff-head { font-size: 12.5px; color: var(--text-muted); line-height: 1.75; margin-bottom: 10px; }
.ai-op {
  border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm);
  padding: 9px 11px; margin-bottom: 8px; font-size: 12.5px; background: var(--surface);
}
.ai-op.off { opacity: .5; }
.ai-op.bad { border-color: var(--danger); background: var(--danger-light); }
.ai-op-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11.5px; color: var(--text-hint); flex-wrap: wrap; }
.ai-op-head strong { font-size: 12px; color: var(--text); font-weight: 600; }
.ai-line {
  line-height: 1.8; padding: 3px 9px; margin-bottom: 3px;
  border-left: 2.5px solid var(--border-strong); border-radius: 0 4px 4px 0;
  white-space: pre-wrap; word-break: break-word;
}
.ai-line.del { border-left-color: var(--danger); background: var(--danger-light); color: var(--danger); }
.ai-line.add { border-left-color: var(--success); background: var(--success-light); color: var(--text); }
.ai-op-why { font-size: 11.5px; color: var(--text-hint); margin-top: 6px; line-height: 1.7; }

/* ── 生成图片面板 ── */
.img-choices { display: flex; gap: 10px; flex-wrap: wrap; }
.img-choice {
  flex: 1; min-width: 200px; text-align: left; cursor: pointer;
  background: var(--surface); border: 0.5px solid var(--border-strong);
  border-radius: var(--radius-sm); padding: 10px 13px;
  display: flex; flex-direction: column; gap: 3px;
  font-family: inherit; transition: all .15s;
}
.img-choice:hover { border-color: var(--accent); background: var(--accent-light); }
.img-choice:disabled { opacity: .55; cursor: default; }
.img-choice-t { font-size: 13px; font-weight: 500; color: var(--text); }
.img-choice-n { font-size: 11.5px; color: var(--text-hint); }
#img-result img { max-height: 70vh; object-fit: contain; }

/* ── 详情抽屉 ── */
#drawer-mask {
  display: none; position: fixed; inset: 0; background: oklch(18% .02 250 / .38);
  z-index: 40;
}
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%);
  background: var(--bg); z-index: 50; display: none; flex-direction: column;
  box-shadow: -8px 0 32px oklch(18% .02 250 / .12);
}
.drawer-head {
  background: var(--surface); border-bottom: 0.5px solid var(--border);
  padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.drawer-head h2 { font-size: 15px; font-weight: 500; flex: 1; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 20px 60px; }
.drawer-close {
  background: none; border: 0.5px solid var(--border); border-radius: var(--radius-sm);
  width: 30px; height: 30px; font-size: 15px; line-height: 1; color: var(--text-muted);
  cursor: pointer; flex-shrink: 0;
}
.drawer-close:hover { color: var(--text); border-color: var(--border-strong); }

.meta-grid {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 16px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.meta-item { display: flex; flex-direction: column; gap: 2px; }
.meta-label { font-size: 11px; color: var(--text-hint); }
.meta-value { font-size: 13.5px; }

.block {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 12px;
}
.block h3 {
  font-size: 13.5px; font-weight: 500; color: var(--accent-text);
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.block h3::before {
  content: attr(data-num); width: 20px; height: 20px; flex-shrink: 0;
  background: var(--accent-light); border: 0.5px solid oklch(82% .1 248);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--accent);
}
.block .content { font-size: 13.5px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }

.actions { display: flex; gap: 8px; margin: 4px 0 16px; flex-wrap: wrap; align-items: center; }
.spacer-flex { flex: 1; }
.del-btn {
  background: none; border: 0.5px solid oklch(82% .1 20);
  border-radius: var(--radius-sm); padding: 7px 14px; font-size: 12.5px;
  color: var(--danger); cursor: pointer; transition: all .15s;
}
.del-btn:hover { background: var(--danger-light); }
.mail-btn {
  background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius-sm); padding: 7px 14px; font-size: 12.5px;
  font-weight: 500; cursor: pointer; transition: all .15s;
}
.mail-btn:hover { filter: brightness(1.08); }
.mail-btn:disabled { opacity: .55; cursor: not-allowed; }
.mail-btn.done { background: var(--success); cursor: default; }
.status-btn {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 7px 14px; font-size: 12.5px;
  color: var(--text-muted); cursor: pointer; transition: all .15s;
}
.status-btn:hover { border-color: var(--border-strong); color: var(--text); }
.status-btn.on {
  background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500;
}
/* 覆盖度体检条：审核方一眼看出六维齐不齐 */
.cov-bar {
  border-radius: var(--radius); padding: 10px 12px; margin: 14px 0;
  border: 0.5px solid var(--border);
}
.cov-bar.ok { background: rgba(26,127,75,.06); border-color: rgba(26,127,75,.28); }
.cov-bar.gap { background: var(--warning-light, #fdf3e0); border-color: rgba(180,120,20,.3); }
.cov-bar-head { font-size: 12.5px; font-weight: 500; margin-bottom: 8px; }
.cov-bar.ok .cov-bar-head { color: #1a7f4b; }
.cov-bar.gap .cov-bar-head { color: var(--warning-text, #8a5a12); }
.cov-bar-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cov-chip {
  font-size: 11.5px; padding: 3px 9px; border-radius: 20px;
  border: 0.5px solid var(--border); background: var(--surface-alt, #fff);
  white-space: nowrap;
}
.cov-chip.ok { color: #1a7f4b; border-color: rgba(26,127,75,.35); }
.cov-chip.gap { color: var(--warning-text, #8a5a12); border-style: dashed; }
.transcript-tgl {
  background: none; border: 0.5px dashed var(--border-strong);
  border-radius: var(--radius-sm); padding: 8px 16px; font-size: 12.5px;
  color: var(--text-muted); cursor: pointer; width: 100%;
}
.transcript-tgl:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-light); }

<script>
/* ─── 配置 ───────────────────────────────────────────── */
const ADMIN_URL = 'https://work-d1gs0jzrg2277d75e-1391683363.ap-shanghai.app.tcloudbase.com/api/admin';
const MAIL_URL = 'https://work-d1gs0jzrg2277d75e-1391683363.ap-shanghai.app.tcloudbase.com/api/mail';

const SECTION_TITLES = ['背景与挑战','核心做法','关键判断与取舍','结果','可复制的经验点','新人注意事项'];
const STATUS_CLASS = { '待审':'wait', '已采纳':'adopt', '已退回':'reject' };
const STATUS_LIST = ['待审','已采纳','已退回'];

/* 模型偶尔把末节写成「新人容易踩的坑」而不是「新人注意事项」，
   其它节也有别称。剥正文首行重复标题时按这张表匹配，避免漏剥。 */
const SECTION_ALIASES = [
  '背景与挑战', '背景', '核心做法', '主要做法', '关键做法', '做法',
  '关键判断与取舍', '关键判断', '结果', '成果',
  '可复制的经验点', '可复制经验点', '可借鉴的经验', '新人注意事项',
  '新人容易踩的坑', '新人避坑', '避坑提示', '海报摘要',
];

/**
 * 剥掉正文首行复述的标题。
 *
 * 归档里的 report_md 段落形如 '…正文\n\n---SECTION---\n\n核心做法\n1. …'，
 * 第 2 节起正文首行前面带着前导换行。之前用的 /^[^\n]*\n/ 只吃掉一个换行，
 * 剩下的标题就留在正文里又显示了一遍（详情页与复制全文都受影响）。
 * 改成「先按标题别名表判断首行是不是标题，是则整行剥掉」，
 * 不吃正文首行、也不依赖换行个数。
 */
function stripSectionHeading(text) {
  let t = String(text || '').replace(/\r/g, '').replace(/^\s+/, '');
  const firstLine = (t.split('\n')[0] || '');
  const norm = firstLine
    .replace(/^\s*(?:#{1,6}\s*)?/, '')
    .replace(/^\s*\d+[.、）)]\s*/, '')
    .replace(/[\s*_【】]/g, '')
    .replace(/[:：]$/, '');
  if (norm && SECTION_ALIASES.indexOf(norm) >= 0) {
    t = t.slice(firstLine.length).replace(/^\s+/, '');
  }
  return t.trim();
}

/* 管理端页面版本号。与访谈页的 APP_BUILD 独立编号，
   手机上缓存难清，靠这一行确认打开的是哪一版。 */
const ADMIN_BUILD = 'v2026.10.10-a';

/* ─── 覆盖度体检（与访谈页 assessCoverage 同一套判据）────────
   访谈页那套是给填表人自己看的；这里重写一份给审核方看（后台原先完全没有）。
   判据必须与访谈页保持一致，否则同一份报告两边显示不同结论。
   六个维度：背景/做法/方法层/结果/判断/避坑；必备三维=背景+做法+结果。
   ──────────────────────────────────────────────────────── */
const COV_DIMS = [
  { k: 'background', label: '案例背景', probe: '客户是什么情况、怎么接触上的', alias: ['背景与挑战', '背景'] },
  { k: 'action',     label: '具体做法', probe: '一步步怎么做的、关键动作',      alias: ['核心做法', '主要做法', '关键做法', '做法'] },
  { k: 'method',     label: '方法层细节', probe: '频次、话术、载体、对方不理会时怎么办', alias: [] },
  { k: 'result',     label: '结果与数据', probe: '带来什么结果、有没有数字',    alias: ['结果', '成果'] },
  { k: 'decision',   label: '判断与取舍', probe: '当时怎么判断的、为什么这么选', alias: ['关键判断与取舍', '关键判断'] },
  { k: 'pitfall',    label: '新人易踩的坑', probe: '新人做这件事容易错在哪',    alias: ['新人容易踩的坑', '新人注意事项', '新人避坑', '避坑提示'] },
];
const COV_METHOD_RE = /(每周|每月|每天|每隔|一次|第\s*\d+\s*天|多久|频次|时机|微信|电话|当面|拉群|朋友圈|名单|系统|原话|开场|说"|说「|对方没反应|不回|拒绝|拖延|怎么办)/;

function covSectionMap(raw) {
  const out = {};
  String(raw || '').split(/\s*---SECTION---\s*/).forEach(part => {
    const lines = String(part).split('\n');
    if (!lines.length) return;
    const title = lines[0]
      .replace(/^\s*(?:\d+[.、）)]\s*|#{1,6}\s*)/, '')
      .replace(/[*_【】]/g, '')
      .replace(/[:：]\s*$/, '')
      .trim();
    out[title] = lines.slice(1).join('\n').trim();
  });
  return out;
}

function covSubstantive(text) {
  const t = String(text || '').replace(/[\s*#\-]/g, '');
  if (t.length < 12) return false;
  if (/^(访谈中未展开|暂无|无|不适用|未提供)/.test(t)) return false;
  return true;
}

function assessCoverageAdmin(raw, transcript) {
  const secs = covSectionMap(raw);
  const turns = Array.isArray(transcript) ? transcript : [];
  const userText = turns
    .filter(m => m.role === 'user' && !m.internal)
    .map(m => String(m.content || '')).join('\n');

  const methodInReport = Object.keys(secs).some(t => COV_METHOD_RE.test(secs[t] || ''));
  const methodInTalk = COV_METHOD_RE.test(userText);

  const dims = COV_DIMS.map(d => {
    let ok = false, note = '';
    if (d.k === 'method') {
      ok = methodInReport && methodInTalk;
      note = ok ? '频次/话术/载体等细节有据可查'
        : (methodInReport ? '报告里有方法层表述，但对话中未见支撑'
          : (methodInTalk ? '对话里提到过，但没写进报告' : '还没问到具体怎么做'));
    } else {
      const hitKey = d.alias.find(a => secs[a] != null)
        || Object.keys(secs).find(t => d.alias.some(a => t.indexOf(a) >= 0));
      const hit = hitKey != null ? secs[hitKey] : null;
      ok = covSubstantive(hit);
      if (d.k === 'result' && ok && !/[0-9０-９]/.test(String(hit))) {
        note = '有内容但没数字，说服力偏弱';
      } else {
        note = ok ? '有实质内容' : '这一块还是空的';
      }
    }
    return { k: d.k, label: d.label, probe: d.probe, ok, note };
  });

  const byKey = {};
  dims.forEach(d => { byKey[d.k] = d; });
  const required = ['background', 'action', 'result'];
  const missing = required.filter(k => !byKey[k].ok);
  const reasons = [];
  if (missing.length) reasons.push('还缺：' + missing.map(k => byKey[k].label).join('、'));
  if (!byKey.method.ok) reasons.push('做法还没落到方法层（频次/话术/载体/应对）');

  // 素材厚度：客户原话累计字数。结构齐但原话极少时不能判"够用"
  const userChars = turns
    .filter(m => m.role === 'user' && !m.internal)
    .reduce((s, m) => s + String(m.content || '').length, 0);
  const thin = userChars < 400;

  return {
    dims, covered: dims.filter(d => d.ok).length, total: dims.length,
    valuable: missing.length === 0 && byKey.method.ok && !thin,
    structural: missing.length === 0 && byKey.method.ok,
    userChars, thin, reasons,
  };
}

/* 覆盖度体检条：审核时一眼看出这份报告六维齐不齐、够不够用。 */
function renderCovBar(row) {
  const c = assessCoverageAdmin(row.report_md, row.transcript);
  const chips = c.dims.map(d =>
    '<span class="cov-chip ' + (d.ok ? 'ok' : 'gap') + '" title="' + esc(d.probe) + '">'
    + (d.ok ? '✓' : '○') + ' ' + esc(d.label) + '</span>'
  ).join('');

  let head, cls;
  if (c.valuable) {
    head = '素材够用 · 六维覆盖 ' + c.covered + '/' + c.total + ' · 原话 ' + c.userChars + ' 字';
    cls = 'ok';
  } else if (c.structural && c.thin) {
    head = '结构齐但原话偏少 · ' + c.covered + '/' + c.total + ' · 原话仅 ' + c.userChars
         + ' 字，报告可能多为概括性表述';
    cls = 'gap';
  } else {
    head = '素材有缺口 · ' + c.covered + '/' + c.total + '（' + c.reasons.join('；') + '）';
    cls = 'gap';
  }

  return '<div class="cov-bar ' + cls + '">'
    + '<div class="cov-bar-head">' + esc(head) + '</div>'
    + '<div class="cov-bar-chips">' + chips + '</div>'
    + '</div>';
}

/* ─── 会话 ───────────────────────────────────────────── */
let auth = { token: '', exp: 0 };
let currentRows = [];
let currentId = null;
let transcriptOpen = false;
let origOpenState = false;   // 「查看模型原文」展开态，重绘后保持
let detailRow = null;

try {
  const saved = JSON.parse(sessionStorage.getItem('iv_admin_auth') || 'null');
  if (saved && saved.token && saved.exp > Date.now()) auth = saved;
} catch (e) {}

function saveAuth() {

}

function toast(msg, isErr) {

  el.className = 'toast show' + (isErr ? ' err' : '');

}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ─── 登录 ───────────────────────────────────────────── */
async function doLogin() {
  const pw = document.getElementById('pw').value;

      body: JSON.stringify({ action: 'login', password: pw }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.token) throw new Error(data.error === 'bad_password' ? '口令不正确' : (data.error || ('HTTP ' + res.status)));

    err.textContent = e.message;

function doLogout() {

/* ─── 接口 ───────────────────────────────────────────── */
async function api(payload) {

/* ─── 列表 ───────────────────────────────────────────── */
function resetFilters() {
  document.getElementById('f-q').value = '';
  document.getElementById('f-city').value = '';

  document.getElementById('f-to').value = '';

/* ── AI 主题 / 标签搜索 ────────────────────────────────────────
   为什么要本地过滤：PostgREST 不支持对 text[] 列做 ilike
   （官方 issue #3920 仍在讨论，明确说没有内置运算符）。
   所以分两步：
     ① 服务端按「标签精确命中」拉候选 —— tags=cs.{维度:取值}
        数组包含查询走 GIN 索引（迁移 20260929100000），一次查询即命中；
     ② 前端再对拿回来的行做子串过滤 —— 覆盖「只记得半截词」的场景，
        ai_topic 与 tags 都参与，并标出到底命中在哪一项。
   只靠 ① 会漏（要求输入完整标签值）；只靠 ② 会漏（候选集被分页截断）。
   两路合并后对当前页是准确的。 */
let aiHits = Object.create(null);   // id → { tags:[], topics:[] }，用于结果标记

function onAiInput() {
  const v = document.getElementById('f-ai').value.trim();
  document.getElementById('f-ai-clear').hidden = !v;
  const hint = document.getElementById('f-ai-hint');
  if (!v) {
    hint.textContent = '在 AI 归纳主题 + 自动标签里找。多个词用空格隔开，表示要同时满足';
    hint.className = 'search-hint';
  } else {
    const n = aiTerms(v).length;
    hint.textContent = n > 1
      ? '回车搜索 · 当前 ' + n + ' 个词，需同时满足；可填标签全称（获客方式:老客户转介绍）或其中半截（老客户）'
      : '回车搜索 · 可填标签全称（获客方式:老客户转介绍）或其中半截（老客户）';
    hint.className = 'search-hint';
  }
}

function clearAiSearch(reload) {
  const el = document.getElementById('f-ai');
  if (el) el.value = '';
  const c = document.getElementById('f-ai-clear');
  if (c) c.hidden = true;
  onAiInput();
  if (reload !== false) loadList();
}

/* 把用户输入拆成待匹配的片段：空格分隔，容忍中英文冒号 */
function aiTerms(raw) {
  return String(raw || '')
    .split(/\s+/)
    .map(s => s.replace(/[：]/g, ':').trim())
    .filter(Boolean);
}

/* 一个片段是否命中某条记录；同时记录命中位置，供结果标记
   ── 多词是「同时满足」(AND)，不是「任一满足」(OR) ──
   搜「棱镜 老客户」要的是「既是棱镜产品、又是老客户转介绍」的案例。
   若按 OR 合并，实测会把「老关系激活」「孤儿单盘活」等只要沾一个词的
   案例全都捞进来，结果比单词搜索还多 —— 那样的多词搜索没有意义。
   每个词可以落在标签上、也可以落在 AI 主题上，但必须「每词都有落点」。 */
function matchAiNote(row, terms) {
  if (!terms.length) return null;
  const tags = Array.isArray(row.tags) ? row.tags : [];
  const topics = row.ai_topic ? [row.ai_topic] : [];
  const hitTags = [];
  const hitTopics = [];

  for (const t of terms) {
    const lower = t.toLowerCase();
    // 标签：支持「维度:取值」整体匹配，也支持只写取值半截
    const tagHit = tags.filter(x => x.toLowerCase().indexOf(lower) >= 0);
    // AI 主题：子串
    const topicHit = topics.some(x => x.toLowerCase().indexOf(lower) >= 0);

    // ★ 这个词在任何一处都没落点 → 整条不匹配（AND 语义的落点）
    if (!tagHit.length && !topicHit) return null;

    if (tagHit.length) hitTags.push(...tagHit);
    if (topicHit) hitTopics.push(row.ai_topic);
  }
  return { tags: [...new Set(hitTags)], topics: [...new Set(hitTopics)] };
}

/* 把命中片段高亮（先转义再替换，避免 XSS） */
function markHit(text, terms) {
  let out = esc(text);
  for (const t of terms) {
    if (!t) continue;
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    out = out.replace(re, '<span class="hit-on">$1</span>');
  }
  return out;
}

async function loadList() {
  const rowsEl = document.getElementById('rows');
  const emptyEl = document.getElementById('empty');
  rowsEl.innerHTML = '';
  emptyEl.style.display = 'none';
  document.getElementById('stats').textContent = '加载中…';

  const aiRaw = document.getElementById('f-ai').value.trim();
  const terms = aiTerms(aiRaw);

  const payload = {
    action: 'list',
    q: document.getElementById('f-q').value.trim(),
    city: document.getElementById('f-city').value,
    page: 1,
    pageSize: 200,
  };
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  if (from) payload.from = from + 'T00:00:00+08:00';
  if (to) payload.to = to + 'T23:59:59+08:00';

  /* 标签精确命中：只有形如「维度:取值」的片段才走服务端 cs 查询，
     其余（半截词、AI 主题片段）留给前端过滤，避免拿不到任何候选。 */
  if (terms.length) {
    const exactTags = terms.filter(t => t.indexOf(':') > 0);
    if (exactTags.length) payload.tags = exactTags.slice(0, 8);
  }

  try {
    const data = await api(payload);
    let rows = data.rows || [];

    /* 前端二次过滤：服务端只负责「标签精确命中」，
       其余情况（半截词/主题片段）在这里兜住 */
    aiHits = Object.create(null);
    if (terms.length) {
      const narrowed = [];
      for (const r of rows) {
        const note = matchAiNote(r, terms);
        if (note) { aiHits[r.id] = note; narrowed.push(r); }
      }
      /* 若服务端已按精确标签筛过，这里只做补充收窄；
         若没筛（全是半截词），这里就是唯一的过滤入口 */
      rows = narrowed;

      if (!rows.length) {
        document.getElementById('stats').textContent =
          'AI 主题/标签里没有匹配「' + aiRaw + '」的记录';
      }
    }

    currentRows = rows;
    renderRows(currentRows);

    const total = data.total != null ? data.total : currentRows.length;
    const tagFiltered = payload.tags && payload.tags.length;
    let stats;
    if (!terms.length) {
      stats = '共 ' + total + ' 条记录' +
        (currentRows.length < total ? '（当前展示前 ' + currentRows.length + ' 条）' : '');
    } else if (!rows.length) {
      /* 搜不到时明确说「在哪搜的、搜的什么」，不然用户分不清
         「没有这条」和「这功能坏了」 */
      stats = 'AI 主题/标签里没有匹配「' + aiRaw + '」的记录';
    } else {
      stats = '共 ' + currentRows.length + ' 条记录' +
        (tagFiltered ? '（已按标签精确筛 ' + payload.tags.join('、') + '）' : '');
    }
    document.getElementById('stats').textContent = stats;
  } catch (e) {
    document.getElementById('stats').textContent = '加载失败：' + e.message;
  }
}

function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function renderRows(rows) {
  const rowsEl = document.getElementById('rows');
  const emptyEl = document.getElementById('empty');
  if (!rows.length) { emptyEl.style.display = 'block'; return; }

  const terms = aiTerms(document.getElementById('f-ai').value);

  rowsEl.innerHTML = rows.map(r => {
    const cls = STATUS_CLASS[r.status] || 'wait';
    const owner = r.backend_owner_name
      ? esc(r.backend_owner_name) + (r.backend_owner_org ? '<br><span style="font-size:11.5px;color:var(--text-hint)">' + esc(r.backend_owner_org) + '</span>' : '')
      : '—';
    const mailed = !!r.mail_sent_at;
    const mailCell = mailed
      ? `<span class="pill ok">已发送</span><br><span style="font-size:11.5px;color:var(--text-hint)">${fmtTime(r.mail_sent_at)}</span>`
      : '<span class="pill wait">未发送</span>';

    /* 搜索命中标记：让用户一眼看到「为什么这条在结果里」 */
    const note = aiHits[r.id];
    const topicBadge = note && note.topics.length
      ? '<span class="hit-badge">主题命中</span>' : '';
    const tagLine = (note && note.tags.length)
      ? `<div class="hit-tags">${note.tags.slice(0, 4).map(t =>
          `<span class="tag-chip">${markHit(t, terms)}</span>`).join('')}${
          note.tags.length > 4 ? `<span class="meta-hint">等 ${note.tags.length} 项</span>` : ''}</div>`
      : '';

    const aiTopicCell = r.ai_topic
      ? `<div class="ell ai-topic-line" title="${esc(r.ai_topic)}">AI 归纳：${markHit(r.ai_topic, terms)}</div>`
      : `<div class="ai-topic-line hint">AI 归纳：待打标</div>`;

    return `<tr onclick="openDetail(${r.id})">
      <td class="nowrap">${fmtTime(r.created_at)}</td>
      <td class="nowrap">${esc(r.city || '—')}</td>
      <td>${esc(r.interviewee_name)}<br><span style="font-size:11.5px;color:var(--text-hint)">${esc(r.interviewee_position)}</span></td>
      <td class="topic"><div class="ell">${esc(r.topic)}</div>${aiTopicCell}${topicBadge}${tagLine}</td>
      <td class="hide-sm">${esc(r.interviewee_um || '—')}</td>
      <td class="hide-sm">${owner}</td>
      <td class="nowrap">${r.round_count || 0}</td>
      <td><span class="pill ${cls}">${esc(r.status)}</span></td>
      <td class="hide-sm nowrap">${mailCell}</td>
    </tr>`;
  }).join('');
}

/* ─── 导出 CSV ───────────────────────────────────────── */
function exportCsv() {
  if (!currentRows.length) { toast('当前列表为空', true); return; }
  const head = ['提交时间','城市','被访谈人','岗位','UM 号','主题','AI 归纳主题','自动标签','后线对接人','对接人所属中心','轮次','状态','邮件发送时间'];
  const body = currentRows.map(r => [
    fmtTime(r.created_at), r.city || '', r.interviewee_name || '', r.interviewee_position || '',
    r.interviewee_um || '', r.topic || '', r.ai_topic || '',
    (r.tags || []).join(' '),
    r.backend_owner_name || '',
    r.backend_owner_org || '', r.round_count || 0, r.status || '',
    r.mail_sent_at ? fmtTime(r.mail_sent_at) : '未发送',
  ]);
  const csv = '\ufeff' + [head, ...body]
    .map(line => line.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(','))
    .join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = '访谈案例归档_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('已导出 ' + currentRows.length + ' 条');
}

async function openDetail(id) {
  currentId = id;
  transcriptOpen = false;
  detailRow = null;
  /* AI 修改的对话历史是「针对某一份报告说的」，换一条记录必须清掉——
     否则上一条的语境会被当成这一条的背景发给模型，改出莫名其妙的东西。 */
  ai.history = [];
  ai.ops = [];
  ai.picked = {};
  ai.lastInstr = '';
  document.getElementById('d-title').textContent = '案例详情';
  document.getElementById('d-body').innerHTML = '<div class="loading">加载中…</div>';
  document.getElementById('drawer').style.display = 'flex';
  document.getElementById('drawer-mask').style.display = 'block';

  try {
    const data = await api({ action: 'detail', id: id });

  } catch (e) {
    document.getElementById('d-body').innerHTML =
      '<div class="loading" style="color:var(--danger)">加载失败：' + esc(e.message) + '</div>';
  }
}

/* ─── 编辑基础信息 ────────────────────────────────────────
   允许修正人工填报的基础信息（被访谈人 / 后线对接人 / 城市 / 主题等）。
   报告正文由「编辑报告正文」单独入口处理（需留痕）；不可编辑的只剩：
   对话原文、轮次、提交时间、发送状态、修订留痕字段——
   这些是归档的原始凭证，改动会破坏可追溯性。服务端有同样的白名单校验。 */
/* up:true 的字段在输入与保存时统一转大写（UM 号。
   大小写混写会让「按工号归因」的匹配对不上，服务端也做同样的归一兜底）。 */
const EDIT_FIELDS = [
  { k: 'interviewee_name',    label: '被访谈人姓名', col: 1, ph: '如：李示例',   hint: '不要填工号/UM' },
  { k: 'interviewee_um',      label: '被访谈人 UM 号', col: 1, ph: '如：LISHILI001', up: true },
  { k: 'interviewee_position',label: '岗位',        col: 1, ph: '如：咨询顾问' },
  { k: 'city',                label: '所属城市',     col: 1, ph: '如：西安市' },
  { k: 'backend_owner_name',  label: '后线对接人姓名', col: 1, ph: '如：刘龙刚', hint: '不要填工号/UM' },
  { k: 'backend_owner_org',   label: '对接人所属中心', col: 1, ph: '如：西安第三咨询中心' },
  { k: 'topic',               label: '案例主题',     col: 2, ph: '如：小微企业主续贷提额' },
];

function openEdit() {
  if (!detailRow) return;
  const box = document.getElementById('edit-box');
  if (box.style.display === 'block') { box.style.display = 'none'; return; }
  document.getElementById('rep-box').style.display = 'none';
  closeAiEdit();

  box.innerHTML = `
    <div class="edit-panel">
      <div class="edit-head">
        <strong>编辑基础信息</strong>
        <span class="edit-note">只影响归档记录与邮件主题；报告正文请用「编辑报告正文」，对话记录不可修改</span>
      </div>
      <div class="edit-grid">
        ${EDIT_FIELDS.map(f => `
          <label class="edit-field" ${f.col === 2 ? 'style="grid-column:1/-1"' : ''}>
            <span class="edit-label">${f.label}${f.hint ? `<em>（${f.hint}）</em>` : ''}</span>
            <input class="edit-input" id="ed-${f.k}" value="${esc(String(detailRow[f.k] == null ? '' : detailRow[f.k]))}" placeholder="${f.ph}"${f.up ? ' oninput="this.value=this.value.toUpperCase()"' : ''}>
          </label>`).join('')}
      </div>
      <div class="edit-foot">
        <span class="edit-msg" id="ed-msg"></span>
        <span class="spacer-flex"></span>
        <button class="ghost-btn" onclick="closeEdit()">取消</button>
        <button class="save-btn" id="ed-save" onclick="saveEdit()">保存修改</button>
      </div>
    </div>`;
  box.style.display = 'block';
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeEdit() {
  const box = document.getElementById('edit-box');
  if (box) box.style.display = 'none';
}

async function saveEdit() {
  if (!currentId || !detailRow) return;
  const fields = {};
  EDIT_FIELDS.forEach(f => {
    const el = document.getElementById('ed-' + f.k);
    if (!el) return;
    // up 字段统一大写：兜住粘贴/自动填充等绕过 oninput 的路径
    fields[f.k] = f.up ? el.value.trim().toUpperCase() : el.value.trim();
  });

  if (!fields.interviewee_name) {
    document.getElementById('ed-msg').textContent = '被访谈人姓名不能为空';
    document.getElementById('ed-msg').className = 'edit-msg err';
    return;
  }

  // 没改动就别发请求
  const changed = Object.keys(fields).filter(k => String(detailRow[k] || '') !== fields[k]);
  if (!changed.length) {
    document.getElementById('ed-msg').textContent = '没有改动';
    document.getElementById('ed-msg').className = 'edit-msg';
    return;
  }

  const btn = document.getElementById('ed-save');
  const msg = document.getElementById('ed-msg');
  btn.disabled = true;
  btn.textContent = '保存中…';

  try {
    const data = await api({ action: 'update', id: currentId, fields: fields });
    // 服务端回传完整行，直接换掉本地缓存并重绘，不必再查一次
    detailRow = data.row || Object.assign({}, detailRow, fields);
    const listRow = currentRows.find(x => x.id === currentId);
    if (listRow) Object.assign(listRow, data.row || fields);

    renderDetail(detailRow);
    renderRows(currentRows);
    openEdit();                       // 重绘后重新展开，让用户看到已保存的值
    const m = document.getElementById('ed-msg');
    m.textContent = '已保存' + (changed.length ? '（' + changed.length + ' 项）' : '');
    m.className = 'edit-msg ok';
    toast('已保存。若邮件已发过，可点「重新发送」用新信息补发。');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '保存修改';
    msg.textContent = '保存失败：' + e.message;
    msg.className = 'edit-msg err';
  }
}

/* ─── 编辑报告正文 ────────────────────────────────────────
   报告正文原设计为「不可编辑」（模型产出、归档原始凭证）。
   实际使用中确有「个别措辞要修」的合理需求，改库风险反而更高，
   因此放开编辑，但强制留痕：
     · 首次编辑前把模型原文快照进 report_orig，之后不再覆盖
     · 每次保存累加 report_rev，记录时间与操作人
     · 详情页对已编辑的记录给出显著提示 + 可展开对照模型原文
     · 服务端强制校验分隔符（至少 5 个 ---SECTION---），
       防止编辑时误删分隔符导致整份报告塌成一节
   对话原文（transcript）仍然不可编辑——那是无法重建的一手凭证。 */
function openReportEdit() {
  if (!detailRow) return;
  const box = document.getElementById('rep-box');
  if (box.style.display === 'block') { box.style.display = 'none'; return; }
  document.getElementById('edit-box').style.display = 'none';
  closeAiEdit();

  const md = String(detailRow.report_md || '');
  const secCount = (md.match(/---SECTION---/g) || []).length;

  box.innerHTML = `
    <div class="edit-panel">
      <div class="edit-head">
        <strong>编辑报告正文</strong>
        <span class="edit-note">改动会记入修订次数，模型原文自动留档；对话记录仍不可修改</span>
      </div>
      <div class="rep-editor">
        <div class="rep-editor-tip">
          节与节之间<strong>必须保留</strong>分隔符 <code>---SECTION---</code>（三横线 + SECTION + 三横线，共 13 个字符）。
          报告按它切成 6 节，删掉会导致整份报告只剩一节、海报也出不来。
          正常应有 <strong>5 个</strong>分隔符；节标题写标准名称即可（背景与挑战 / 核心做法 / 关键判断与取舍 / 结果 / 可复制的经验点 / 新人容易踩的坑）。
        </div>
        <textarea id="rep-md" oninput="checkRepSections()">${esc(md)}</textarea>
        <div class="edit-foot">
          <span class="rep-editor-stat" id="rep-stat"></span>
          <span class="edit-msg" id="rep-msg"></span>
          <span class="spacer-flex"></span>
          <button class="ghost-btn" onclick="closeReportEdit()">取消</button>
          <button class="save-btn" id="rep-save" onclick="saveReportEdit()">保存正文</button>
        </div>
      </div>
    </div>`;
  box.style.display = 'block';
  checkRepSections();
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeReportEdit() {
  const box = document.getElementById('rep-box');
  if (box) box.style.display = 'none';
}

/** 实时显示分隔符计数，不足 5 个时标红并禁用保存——不让人把报告改废。 */
function checkRepSections() {
  const ta = document.getElementById('rep-md');
  const stat = document.getElementById('rep-stat');
  const btn = document.getElementById('rep-save');
  if (!ta || !stat) return;
  const n = (ta.value.match(/---SECTION---/g) || []).length;
  const chars = ta.value.length;
  const okSec = n >= 5;
  stat.textContent = `分隔符 ${n} 个（需 ≥5）· 共 ${chars} 字`;
  stat.className = 'rep-editor-stat ' + (okSec ? 'good' : 'bad');
  if (btn) {
    btn.disabled = !okSec;
    btn.textContent = okSec ? '保存正文' : '分隔符不足，无法保存';
  }
}

async function saveReportEdit() {
  if (!currentId || !detailRow) return;
  const ta = document.getElementById('rep-md');
  const msg = document.getElementById('rep-msg');
  if (!ta) return;

  const md = ta.value;
  const n = (md.match(/---SECTION---/g) || []).length;
  if (n < 5) {
    msg.textContent = '分隔符只有 ' + n + ' 个，至少需要 5 个';
    msg.className = 'edit-msg err';
    return;
  }
  if (md === String(detailRow.report_md || '')) {
    msg.textContent = '正文没有改动';
    msg.className = 'edit-msg';
    return;
  }

  const btn = document.getElementById('rep-save');
  btn.disabled = true;
  btn.textContent = '保存中…';

  try {
    const data = await api({ action: 'update', id: currentId, fields: { report_md: md } });
    detailRow = data.row || Object.assign({}, detailRow, { report_md: md });
    const listRow = currentRows.find(x => x.id === currentId);
    if (listRow && data.row) Object.assign(listRow, data.row);

    renderDetail(detailRow);
    openReportEdit();
    const m = document.getElementById('rep-msg');
    m.textContent = '已保存（第 ' + (detailRow.report_rev || 1) + ' 次修订）';
    m.className = 'edit-msg ok';
    toast('正文已保存。图与邮件还是旧的，建议重出图后再「重新发送」。');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '保存正文';
    msg.textContent = '保存失败：' + e.message;
    msg.className = 'edit-msg err';
  }
}

/* ─── AI 辅助修改报告正文 ──────────────────────────────────
   为什么会长成这个样子（每一处都是为了让模型少一点自由发挥的余地）：

   1. **模型只输出补丁，永远不输出全文。** 它给的是
      {sec, op, before, after} —— 没被补丁点到的段落由这里原样保留。
      「顺手把别处也润色一下」在物理上不可能发生，不需要靠提示词去求它。

   2. **before 必须能在原文里逐字找到**（indexOf）。找不到的那条直接在
      diff 里标红停用，不让模型对「改哪里」的描述直接生效。
      模型可以撒谎说某句话存在，但一句都匹配不上就什么都改不了。

   3. **每条改动都带「依据：指令第几条」**，写在 diff 上给人看。
      对不上任何指令的改动，模型应写进 unclear 而不是 ops。

   4. **不新增写入口。** 应用改动只是把结果填进「编辑报告正文」的文本框，
      保存仍然走原来的 action:'update' + fields:{report_md}——
      那条路径自带 report_orig 首次快照、report_rev 累加、分隔符 ≥5 校验。
      绕开它另存一次，等于让 AI 改过的正文逃掉留痕。

   5. **正文从服务端读**，不拿前端手里这份做定位基准——
      前端的 report_md 可能还是上一次保存的版本，拿它定位会让补丁对不上。 */

/* 与访谈页的 SECTION_TITLES 对齐（比详情页展示的多一节「海报摘要」）。
   刻意不写死节数：老报告是 6 节、新报告是 7 节，按实际切出来的段数走。 */
const AI_SECS = ['背景与挑战','核心做法','关键判断与取舍','结果','可复制的经验点','新人容易踩的坑','海报摘要'];

const AI_EXAMPLES = [
  '把结果节里的 30% 改成 32%，口径含转介绍',
  '核心做法第 2 步补一句：客户是自己 2023 年的老客户',
  '删掉「新人容易踩的坑」里跟主题无关的那条',
];

let ai = {
  mode: 'patch',
  history: [],     // [{role, content, err}]
  ops: [],         // 渲染用条目：{sec, op, before, after, why, ok, hits}
  picked: {},      // 下标 → true
  baseMd: '',      // 发起这一批改动时的正文（定位基准）
  busy: false,
  lastInstr: '',   // 供「重试」用
};

function aiSecName(i) { return AI_SECS[i] || ('第 ' + (i + 1) + ' 节'); }

function aiMdParts(md) { return String(md == null ? '' : md).split('---SECTION---'); }

function trunc(s, n) {
  const t = String(s || '');
  return t.length > n ? t.slice(0, n) + '…' : t;
}

function openAiEdit() {
  if (!detailRow) return;
  const box = document.getElementById('ai-box');
  if (box.style.display === 'block') { closeAiEdit(); return; }
  document.getElementById('edit-box').style.display = 'none';
  document.getElementById('rep-box').style.display = 'none';

  ai.ops = [];
  ai.picked = {};
  ai.busy = false;

  /* 正文编辑器里如果有没保存的手工改动，AI 改完应用时会以「已保存的版本」
     为基准整体覆盖 —— 不提醒的话，手工改的那几笔会无声消失。 */
  const repTa = document.getElementById('rep-md');
  if (repTa && repTa.value !== String(detailRow.report_md || '')) {
    toast('正文编辑器里有未保存的手工改动。AI 改动会以「已保存的版本」为基准，应用后会覆盖它。', true);
  }

  const parts = aiMdParts(detailRow.report_md);
  box.innerHTML = `
    <div class="edit-panel">
      <div class="edit-head">
        <strong>AI 辅助修改</strong>
        <span class="edit-note">用一句话说清要改什么；模型只做你点名的那几处，其余一字不动</span>
      </div>

      <div class="ai-note">
        这块<strong>不会</strong>让模型重写全文。模型只回「哪一节、把哪句改成哪句」，
        然后在正文里<strong>逐字定位</strong>再替换 —— 没被点到的段落原样保留。
        改动会先在下面列出来给你逐条过目，确认后才填进正文编辑器，
        保存仍走原路径（记修订次数、留模型原文快照）。<br>
        <strong>要补什么，就直接写出来。</strong>实测「把结果节写得更充实」这类笼统指令，
        模型会拒绝执行（它不知道该写什么）；而「把这句话说得再具体一点」它会自己加细节 ——
        这就是自行添加的口子。指令里带上具体内容，改动才是你要的那一版。
      </div>

      <div class="ai-mode">
        <label class="${ai.mode === 'patch' ? 'on' : ''}" id="ai-mode-patch">
          <input type="radio" name="ai-mode" value="patch" ${ai.mode === 'patch' ? 'checked' : ''} onchange="aiSyncMode()">定点修改（替换 / 补充 / 删除）
        </label>
        <label class="${ai.mode === 'section' ? 'on' : ''}" id="ai-mode-section">
          <input type="radio" name="ai-mode" value="section" ${ai.mode === 'section' ? 'checked' : ''} onchange="aiSyncMode()">按补充重写指定节
        </label>
      </div>

      <div id="ai-secs-wrap" style="display:${ai.mode === 'section' ? 'block' : 'none'}">
        <div class="edit-label" style="margin-bottom:5px">要重写哪几节（其余节一个字都不会动）</div>
        <div class="ai-secs" id="ai-secs">
          ${parts.map((_, i) => `
            <label id="ai-sec-${i + 1}">
              <input type="checkbox" onchange="aiSyncSecs()">${esc(aiSecName(i))}
            </label>`).join('')}
        </div>
      </div>

      <div class="ai-input-row">
        <textarea class="ai-input" id="ai-ta" placeholder="例：把结果节里的 30% 改成 32%，口径含转介绍&#10;例：核心做法第 2 步补一句——客户是自己 2023 年的老客户"></textarea>
        <button class="save-btn" id="ai-send" onclick="aiSend()">让 AI 改</button>
      </div>
      <div class="ai-examples">
        <b>可以这样写：</b>${AI_EXAMPLES.map(e => `<span onclick="aiFillExample(this)">${esc(e)}</span>`).join('')}
      </div>

      <div class="ai-log" id="ai-log"></div>
      <div class="ai-diff" id="ai-diff"></div>

      <div class="edit-foot">
        <span class="edit-msg" id="ai-top-msg"></span>
        <span class="spacer-flex"></span>
        <button class="ghost-btn" onclick="aiResetAll()">清空本轮的对话与改动</button>
        <button class="ghost-btn" onclick="closeAiEdit()">收起</button>
      </div>
    </div>`;
  box.style.display = 'block';
  renderAiLog();
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeAiEdit() {
  const box = document.getElementById('ai-box');
  if (box) box.style.display = 'none';
}

function aiFillExample(el) {
  const ta = document.getElementById('ai-ta');
  if (ta) { ta.value = el.textContent; ta.focus(); }
}

/** 模式切换：只改 DOM 上的高亮，状态一律现场从 DOM 读，避免两边不一致。 */
function aiSyncMode() {
  const r = document.querySelector('input[name="ai-mode"]:checked');
  ai.mode = r && r.value === 'section' ? 'section' : 'patch';
  const a = document.getElementById('ai-mode-patch');
  const b = document.getElementById('ai-mode-section');
  if (a) a.className = ai.mode === 'patch' ? 'on' : '';
  if (b) b.className = ai.mode === 'section' ? 'on' : '';
  const wrap = document.getElementById('ai-secs-wrap');
  if (wrap) wrap.style.display = ai.mode === 'section' ? 'block' : 'none';
}

function aiSyncSecs() {
  const wrap = document.getElementById('ai-secs');
  if (!wrap) return;
  Array.prototype.forEach.call(wrap.querySelectorAll('label'), function (lab) {
    const cb = lab.querySelector('input');
    lab.className = cb && cb.checked ? 'on' : '';
  });
}

function aiTargets() {
  const wrap = document.getElementById('ai-secs');
  if (!wrap) return [];
  const out = [];
  Array.prototype.forEach.call(wrap.querySelectorAll('label'), function (lab, i) {
    const cb = lab.querySelector('input');
    if (cb && cb.checked) out.push(i + 1);
  });
  return out;
}

function aiResetAll() {
  ai.history = [];
  ai.ops = [];
  ai.picked = {};
  ai.lastInstr = '';
  renderAiLog();
  renderAiDiff([]);
  setAiMsg('', '');
}

function renderAiLog() {
  const box = document.getElementById('ai-log');
  if (!box) return;
  box.innerHTML = ai.history.map(function (h) {
    const cls = h.role === 'user' ? 'u' : (h.err ? 'e' : 'a');
    return `<div class="ai-turn ${cls}">${h.role === 'user' ? '你：' : 'AI：'}${esc(h.content)}</div>`;
  }).join('');
}

function setAiMsg(text, cls) {
  const m = document.getElementById('ai-top-msg');
  if (m) { m.textContent = text || ''; m.className = 'edit-msg ' + (cls || ''); }
}

function setAiBusy(b) {
  ai.busy = b;
  const btn = document.getElementById('ai-send');
  const ta = document.getElementById('ai-ta');
  if (btn) { btn.disabled = b; btn.textContent = b ? '思考中…' : '让 AI 改'; }
  if (ta) ta.disabled = b;
}

/** 把服务端回的补丁转成可渲染的条目，并当场判定每条能不能在原文里定位。 */
function aiBuildOps(data) {
  const parts = aiMdParts(ai.baseMd);

  if (data.mode === 'section') {
    return (data.sections || []).map(function (s) {
      return {
        sec: s.sec,
        op: 'rewrite',
        before: String(parts[s.sec - 1] || '').trim(),
        after: String(s.body || '').trim(),
        why: '',
        ok: true,
        hits: 1,
      };
    });
  }

  return (data.ops || []).map(function (o) {
    const body = String(parts[o.sec - 1] || '');
    let hits = 0;
    let at = body.indexOf(o.before);
    while (at >= 0) { hits++; at = body.indexOf(o.before, at + o.before.length); }
    return {
      sec: o.sec,
      op: o.op,
      before: o.before,
      after: o.after,
      why: o.why,
      ok: hits > 0,
      hits: hits,
    };
  });
}

async function aiSend() {
  if (!currentId || !detailRow || ai.busy) return;

  const ta = document.getElementById('ai-ta');
  const instruction = ta ? String(ta.value || '').trim() : '';
  if (!instruction) { setAiMsg('先写一句要改什么', 'err'); return; }

  const targets = aiTargets();
  if (ai.mode === 'section' && !targets.length) {
    setAiMsg('「按补充重写指定节」要先勾选要重写哪几节', 'err');
    return;
  }

  // 定位基准 = 库里那一份（服务端也是拿它算的补丁）。
  // 注意：正文编辑器里没保存的手工改动不参与定位，应用时会被覆盖 —— openAiEdit 里已提示。
  ai.baseMd = String(detailRow.report_md || '');

  ai.lastInstr = instruction;
  ai.history.push({ role: 'user', content: instruction });
  if (ta) ta.value = '';
  renderAiLog();
  setAiMsg('正在让模型改…', '');
  setAiBusy(true);

  try {
    const data = await api({
      action: 'ai_edit',
      id: currentId,
      mode: ai.mode,
      instruction: instruction,
      targets: targets,
      // 历史只带「已说过的话」，不含本轮刚 push 的这条
      history: ai.history.slice(0, -1).map(function (h) {
        return { role: h.role, content: h.content };
      }),
    });

    ai.ops = aiBuildOps(data);
    ai.picked = {};
    ai.ops.forEach(function (o, i) { ai.picked[i] = o.ok; });

    const bad = ai.ops.filter(function (o) { return !o.ok; }).length;
    let summary;
    if (data.note) {
      summary = data.note;
    } else if (ai.mode === 'section') {
      summary = '准备重写第 ' + ai.ops.map(function (o) { return o.sec; }).join('、') +
        ' 节。下面是重写后的内容，确认了再应用。';
    } else if (!ai.ops.length) {
      summary = '模型没有给出任何改动。';
    } else {
      summary = '准备了 ' + ai.ops.length + ' 处改动' +
        (bad ? '，其中 ' + bad + ' 处没能在正文里逐字定位到（已自动停用）' : '') +
        '。下面是逐条对照，勾掉不想采纳的，再点「应用改动」。';
    }
    ai.history.push({ role: 'assistant', content: summary });
    renderAiLog();
    renderAiDiff(data.unclear || []);
    setAiMsg('', '');
  } catch (e) {
    ai.history.push({ role: 'assistant', content: '没改成：' + e.message, err: true });
    renderAiLog();
    setAiMsg('请求失败：' + e.message, 'err');
  } finally {
    setAiBusy(false);
  }
}

function renderAiDiff(unclear) {
  const box = document.getElementById('ai-diff');
  if (!box) return;

  if (!ai.ops.length && !(unclear && unclear.length)) { box.innerHTML = ''; return; }

  const bad = ai.ops.filter(function (o) { return !o.ok; }).length;
  let html = '<div class="ai-diff-head">' +
    (ai.ops.length
      ? '共 <strong>' + ai.ops.length + '</strong> 处改动' +
        (bad ? '，<strong style="color:var(--danger)">' + bad + '</strong> 处未能在正文里定位到（已停用）' : '') +
        '。逐条勾选要采纳的，再点「应用改动」——应用后正文会填进下方的编辑器，还要再点一次「保存正文」才真正落库。'
      : '模型没有给出改动。') +
    '</div>';

  ai.ops.forEach(function (o, i) {
    const on = !!ai.picked[i];
    const cls = 'ai-op' + (o.ok ? '' : ' bad') + (on ? '' : ' off');
    const kind = o.op === 'rewrite' ? '整节重写'
      : o.op === 'delete' ? '删除'
      : o.op === 'insert_after' ? '补充' : '替换';

    html += `<div class="${cls}">
      <div class="ai-op-head">
        <input type="checkbox" ${on ? 'checked' : ''} ${o.ok ? '' : 'disabled'}
          onchange="aiPick(${i}, this.checked)">
        <strong>第 ${o.sec} 节 · ${esc(aiSecName(o.sec - 1))}</strong>
        <span>${kind}</span>
        ${o.ok ? '' : '<span style="color:var(--danger)">⚠ 原文里找不到这句，无法定位</span>'}
        ${o.ok && o.hits > 1 ? '<span style="color:var(--warning-text)">⚠ 原文中出现 ' + o.hits + ' 次，只会替换第一处</span>' : ''}
      </div>`;

    if (o.op === 'rewrite') {
      html += `<div class="ai-line add">${esc(trunc(o.after, 1200))}</div>`;
    } else if (o.op === 'insert_after') {
      html += `<div class="ai-line del">插在：${esc(trunc(o.before, 300))}</div>
               <div class="ai-line add">补充：${esc(trunc(o.after, 800))}</div>`;
    } else if (o.op === 'delete') {
      html += `<div class="ai-line del">删除：${esc(trunc(o.before, 400))}</div>`;
    } else {
      html += `<div class="ai-line del">原：${esc(trunc(o.before, 400))}</div>
               <div class="ai-line add">改：${esc(trunc(o.after, 800))}</div>`;
    }

    if (o.why) html += `<div class="ai-op-why">依据：${esc(o.why)}</div>`;
    html += '</div>';
  });

  (unclear || []).forEach(function (u) {
    html += `<div class="ai-op">
      <div class="ai-op-head"><strong style="color:var(--warning-text)">模型没把握、没有动的地方</strong></div>
      ${esc(u)}</div>`;
  });

  html += `<div class="edit-foot">
      <span class="edit-msg" id="ai-msg"></span>
      <span class="spacer-flex"></span>
      <button class="ghost-btn" onclick="aiResetResult()">丢掉这一批</button>
      <button class="ghost-btn" onclick="aiRetry()">换个说法重试</button>
      <button class="save-btn" id="ai-apply" onclick="aiApply()">应用改动</button>
    </div>`;

  box.innerHTML = html;
}

function aiPick(i, on) {
  ai.picked[i] = !!on;
  const all = document.querySelectorAll('#ai-diff .ai-op');
  if (all[i]) all[i].className = 'ai-op' + (ai.ops[i].ok ? '' : ' bad') + (on ? '' : ' off');
  const msg = document.getElementById('ai-msg');
  if (msg) msg.textContent = '';
}

function aiResetResult() {
  ai.ops = [];
  ai.picked = {};
  renderAiDiff([]);
}

function aiRetry() {
  const ta = document.getElementById('ai-ta');
  if (ta && !ta.value && ai.lastInstr) ta.value = ai.lastInstr;
  setAiMsg('改一下说法后重新点「让 AI 改」', '');
  if (ta) ta.focus();
}

/**
 * 把选中的改动落到正文上，然后**交给「编辑报告正文」面板做最终核对与保存**。
 *
 * 刻意不在这里直接调保存接口：
 *   ① 人需要在完整的正文里再看一眼，而不是只看 diff；
 *   ② 保存必须走 action:'update' 这条唯一的留痕路径，
 *      这里再写一次库就等于绕开 report_rev / report_orig。
 */
function aiApply() {
  const idx = [];
  ai.ops.forEach(function (o, i) { if (ai.picked[i] && o.ok) idx.push(i); });
  if (!idx.length) {
    const m = document.getElementById('ai-msg');
    if (m) { m.textContent = '没有勾选任何可用的改动'; m.className = 'edit-msg err'; }
    return;
  }

  const parts = aiMdParts(ai.baseMd);
  let applied = 0;
  let skipped = 0;

  idx.forEach(function (i) {
    const o = ai.ops[i];
    const s = o.sec - 1;
    if (s < 0 || s >= parts.length) { skipped++; return; }

    if (o.op === 'rewrite') {
      parts[s] = '\n\n' + o.after + '\n\n';
      applied++;
      return;
    }

    const at = parts[s].indexOf(o.before);
    if (at < 0) { skipped++; return; }

    if (o.op === 'delete') {
      parts[s] = parts[s].slice(0, at) + parts[s].slice(at + o.before.length);
    } else if (o.op === 'insert_after') {
      const end = at + o.before.length;
      parts[s] = parts[s].slice(0, end) + '\n\n' + o.after + parts[s].slice(end);
    } else {
      parts[s] = parts[s].slice(0, at) + o.after + parts[s].slice(at + o.before.length);
    }
    applied++;
  });

  const md = parts.join('---SECTION---');
  const secCount = (md.match(/---SECTION---/g) || []).length;
  if (secCount < 5) {
    const m = document.getElementById('ai-msg');
    if (m) {
      m.textContent = '应用后分隔符只剩 ' + secCount + ' 个（需 ≥5），已中止。请检查是否误删了整节。';
      m.className = 'edit-msg err';
    }
    return;
  }

  // 切到正文编辑器做最终核对——保存按钮、留痕、分隔符校验全用那一套
  closeAiEdit();
  closeReportEdit();
  openReportEdit();
  const ta = document.getElementById('rep-md');
  if (ta) {
    ta.value = md;
    checkRepSections();
    ta.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  const m = document.getElementById('rep-msg');
  if (m) {
    m.textContent = 'AI 已应用 ' + applied + ' 处改动' + (skipped ? '（' + skipped + ' 处跳过）' : '');
    m.className = 'edit-msg ok';
  }
  toast('已填入 ' + applied + ' 处 AI 改动，核对后点「保存正文」。');
}

function safeImageName(kind) {
  const label = kind === 'full' ? '完整报告' : '经验一图流';
  const base = (detailRow && detailRow.interviewee_name) || '报告';
  const day = String((detailRow && detailRow.created_at) || '').slice(0, 10).replace(/-/g, '');
  return (label + '-' + base + (day ? '-' + day : '')).replace(/[\\/:*?"<>|\s]/g, '') + '.png';

async function genImage(kind) {
  if (!currentId || !detailRow) return;
  const msg = document.getElementById('img-msg');
  const prev = document.getElementById('img-prev');
  const dl = document.getElementById('img-dl');
  if (!msg || !prev || !dl) return;

  setImgBusy(true, kind);
  msg.textContent = '排版并渲染中…（完整报告较长，可能要等几秒）';
  msg.className = 'edit-msg';
  document.getElementById('img-result').style.display = 'none';

  try {
    const p = await fetchPosterHtml(currentId, kind);
    const png = await rasterizeAuto(p.html, p.css, p.w, p.h);

    prev.src = png;
    dl.href = png;
    dl.setAttribute('download', safeImageName(kind));

    const bytes = Math.round(png.length * 3 / 4);
    document.getElementById('img-result').style.display = 'block';
    msg.textContent = '已生成';
    msg.className = 'edit-msg ok';
    document.getElementById('img-size').textContent =
      Math.round(bytes / 1024) + ' KB · ' + (p.kind === 'full' ? '完整报告' : '一图流');
  } catch (e) {
    msg.textContent = '生成失败：' + e.message;
    msg.className = 'edit-msg err';
  } finally {
    setImgBusy(false, '');

}

/* ─── 发送邮件 ─────────────────────────────────────────────
   收件人固定在服务端环境变量里（MAIL_TO / MAIL_CC），前端只传归档 id，
   服务端自己从 PG 取报告并排版。主题格式也是服务端统一的：
   访谈报告【后线对接人姓名】访谈主题

   流程分两步：
   ① want_html=true 拿服务端排好的海报 HTML（版式的唯一来源在服务端）；
   ② 在浏览器里用 SVG foreignObject 把 HTML 栅格化成 PNG
     （零依赖方案：海报不含任何外部图片/字体，全部是 CSS 文本，可以安全
     画进 canvas），连同 id 一起再调一次 /api/mail 发出去。
   栅格化失败不阻塞发送——邮件正文本身就是海报版式，只是没图。 */

async function fetchPosterHtml(id, kind) {
  const res = await fetch(MAIL_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: auth.token, exp: auth.exp, id: id, want_html: true, kind: kind || '' }),
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { doLogout(); throw new Error('登录已过期，请重新输入口令'); }
  /* 服务端对「显式要一图流但没有海报摘要」回 HTTP 200 + ok:false：
     不静默换版式，这里把原因翻成人话给运营看。 */
  if (data && data.ok === false) {
    if (data.error === 'poster_summary_missing') {
      throw new Error('这份报告是旧版模板生成的，没有「海报摘要」节，出不了简略一图流。请改选「完整报告」。');
    }
    throw new Error(data.detail || data.error || '出图失败');
  }
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

function rasterizePoster(html, css, w, h) {
  // ① 去掉 XML 不允许的控制字符；② 未自闭合的 <br>/<hr> 归一成自闭合 ——
  // foreignObject 里按 XML 解析，裸 <br> 会让整张 SVG 报错（img.onerror），
  // 完整长图出不来、补发邮件就少一张附件。HTML 里自闭合写法完全等价。
  const clean = String(html)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/<br\s*>/gi, '<br/>')
    .replace(/<hr\s*>/gi, '<hr/>');
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
    '<foreignObject width="100%" height="100%">' +
    '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + w + 'px;height:' + h + 'px;overflow:hidden;background:#fff">' +
    '<style>' + css + '</style>' + clean +
    '</div></foreignObject></svg>';

  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error('海报栅格化失败'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

/**
 * 量出一段 markup 在指定宽度下的真实高度（供完整报告长图用）。
 *
 * 一图流是 16:9 固定画布，服务端直接给得出 h；完整报告长图的高度由
 * 内容决定，服务端估高会随字号/换行漂移，估短了就裁掉最后一段，
 * 所以让浏览器把 markup 先插进离屏容器实测，再拿这个高度去拼 SVG。
 *
 * 安全前提：长图模板的 CSS 全部挂在 .rpt-page 作用域下、排版完全自足
 * （见 poster.js），所以可以安全地短暂插入本页，量完立即移除。
 * 字号/行高在这里显式写成中性值，避免继承本页 body 的 14px 影响实测。
 */
function measureMarkupHeight(html, css, w) {
  return new Promise((resolve) => {
    const holder = document.createElement('div');
    holder.style.cssText =
      'position:fixed;left:-10000px;top:0;width:' + w + 'px;visibility:hidden;' +
      'font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:16px;line-height:normal;';
    const styleEl = document.createElement('style');
    styleEl.textContent = String(css || '');
    holder.innerHTML = String(html).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
    document.body.appendChild(styleEl);
    document.body.appendChild(holder);

    requestAnimationFrame(() => {
      try {
        const rect = holder.getBoundingClientRect();
        resolve(Math.ceil(Math.max(rect.height, holder.scrollHeight)) + 2);
      } catch (e) {
        resolve(0);
      } finally {
        holder.remove();
        styleEl.remove();
      }
    });
  });
}

/* 长图高度兜底上限：超出说明数据异常，宁可不出图也不把浏览器画崩 */
const MAX_FULL_PNG_H = 9000;

async function rasterizeAuto(html, css, w, hHint) {
  let h = hHint;
  if (!h) {
    h = await measureMarkupHeight(html, css, w);
    if (!h) throw new Error('无法量出长图高度');
    if (h > MAX_FULL_PNG_H) h = MAX_FULL_PNG_H;
  }
  return rasterizePoster(html, css, w, h);
}

/* 补记发送状态。
   有些报告是在邮箱里直接发掉的，没走这个页面的「发送邮件」按钮，
   归档里的 mail_sent_at 就一直空着：列表显示「未发送」，事后也分不清
   是漏发还是已发。这个按钮只补记状态，**不会真的再发一封**。
   服务端 mail_sent_at 平时由发送逻辑独占维护，人工补记走 mark_sent 专用分支。 */
async function markSent() {
  if (!currentId || !detailRow) return;
  if (!confirm('确认这份报告已经在邮箱里发出过了？\n\n这里只补记「已发送」状态，不会真的再发一封邮件。')) return;
  try {
    const data = await api({ action: 'mark_sent', id: currentId });
    const at = data.mail_sent_at || new Date().toISOString();
    detailRow.mail_sent_at = at;
    const listRow = currentRows.find(x => x.id === currentId);
    if (listRow) listRow.mail_sent_at = at;
    renderDetail(detailRow);
    renderRows(currentRows);
    toast('已补记发送状态（' + fmtTime(at) + '）');
  } catch (e) {
    toast('补记失败：' + (e && e.message ? e.message : e), true);
  }
}

async function sendMail() {
  if (!currentId || !detailRow) return;
  const btn = document.getElementById('mail-btn');
  if (!btn || btn.disabled) return;

  btn.disabled = true;
  btn.textContent = '生成图片…';
  let png = null;
  let fullPng = null;
  try {
    /* 两张图：简略一图流 + 完整报告长图。哪张失败就少带哪张，
       不阻塞发送——正文本身就是海报版式 + 报告全文。 */
    try {
      const p = await fetchPosterHtml(currentId, 'flow');
      png = await rasterizeAuto(p.html, p.css, p.w, p.h);
    } catch (e) {
      png = null;
    }
    try {
      const f = await fetchPosterHtml(currentId, 'full');
      fullPng = await rasterizeAuto(f.html, f.css, f.w, f.h);
    } catch (e) {
      fullPng = null;
    }

    btn.textContent = '发送中…';
    const res = await fetch(MAIL_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: auth.token, exp: auth.exp, id: currentId,
        poster_png_base64: png, full_png_base64: fullPng,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) {
      doLogout();
      throw new Error('登录已过期，请重新输入口令');
    }
    if (!res.ok) throw new Error(data.detail || data.error || ('HTTP ' + res.status));

    btn.classList.add('done');
    const files = (data.attachments || []).map(a => a.filename).join('、');
    btn.textContent = '已发送 ✓';
    toast('已发送至 ' + (data.to || []).join('、') + (files ? '（附件：' + files + '）' : ''));

    // 回写本地状态：之后按钮显示「重新发送」，并刷新详情里的发送时间
    const sentAt = data.mail_sent_at || new Date().toISOString();
    if (detailRow) detailRow.mail_sent_at = sentAt;
    const listRow = currentRows.find(x => x.id === currentId);
    if (listRow) { listRow.mail_sent_at = sentAt; renderRows(currentRows); }
    setTimeout(() => {
      btn.classList.remove('done');
      btn.textContent = '重新发送';
      btn.disabled = false;
      if (detailRow) renderDetail(detailRow);
    }, 4000);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '重新发送';
    toast('发送失败：' + e.message, true);
  }
}

function buildPlainReport(row) {
  const parts = String(row.report_md || '').split('---SECTION---');
  let text = '案例经验报告\n访谈对象：' + row.interviewee_name + '（' + row.interviewee_position + '）\n' +
             'UM 号：' + (row.interviewee_um || '—') + '\n' +
             '所属城市：' + (row.city || '—') + '\n案例主题：' + row.topic + '\n' +
             '对话轮次：' + (row.round_count || 0) + '\n' +
             '后线对接人：' + (row.backend_owner_name || '—') +
             (row.backend_owner_org ? '（' + row.backend_owner_org + '）' : '') +
             '\n提交时间：' + fmtTime(row.created_at) + '\n\n';
  SECTION_TITLES.forEach((title, i) => {
    const t = stripSectionHeading(parts[i]);
    text += (i + 1) + '. ' + title + '\n' + t + '\n\n';
  });
  return text;
}

function copyDetail() {
  if (!detailRow) return;
  navigator.clipboard.writeText(buildPlainReport(detailRow))
    .then(() => toast('报告全文已复制'))
    .catch(() => toast('复制失败，请手动选择', true));
}

function exportJson() {
  if (!detailRow) return;
  const url = URL.createObjectURL(new Blob([JSON.stringify(detailRow, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = '案例_' + detailRow.id + '_' + detailRow.interviewee_name + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('已导出本条数据');
}

async function deleteRecord() {
  if (!currentId || !detailRow) return;
  const label = '【' + detailRow.interviewee_name + '】' + (detailRow.topic || '');
  if (!confirm('确认删除这条归档记录？\n\n' + label + '\n\n删除后不可恢复，建议先「导出本条数据」备份。')) return;
  if (!confirm('再次确认：确定要永久删除该记录？')) return;
  try {
    await api({ action: 'delete', id: currentId });
    toast('已删除');
    closeDrawer();
    loadList();
  } catch (e) {
    toast('删除失败：' + e.message, true);
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* ─── 启动 ───────────────────────────────────────────── */
(() => {
  const el = document.getElementById('build-stamp');
  if (el) el.textContent = '程序版本 ' + ADMIN_BUILD;
  console.log('[管理端] 程序版本 ' + ADMIN_BUILD);
})();
if (auth.token && auth.exp > Date.now()) enterApp();
</script>

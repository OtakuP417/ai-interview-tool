<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTO-RUNNING</title>
<style>
  body{font:12px/1.5 monospace;background:#0f1115;color:#e8eaf0;padding:10px;margin:0}
  .r{padding:3px 0;border-bottom:1px solid #262b36;white-space:pre-wrap;word-break:break-all}
  .ok{color:#3ddc84}.bad{color:#ff5c5c}.dim{color:#8b93a7}
  #v{font-size:14px;font-weight:700;padding:8px;background:#221a12;border:1px solid #EA5504;border-radius:8px;margin-bottom:10px}
</style>
</head>
<body>
<div id="v">体积阶梯扫描运行中…（约 20 秒）</div>
<div id="out"></div>
<script>
const API = 'https://work-d1gs0jzrg2277d75e-1391683363.ap-shanghai.app.tcloudbase.com/api';
const out = document.getElementById('out');
const lines = [];
function w(txt, cls) {
  lines.push('<div class="r ' + (cls || '') + '">' + String(txt).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) + '</div>');
  out.innerHTML = lines.join('');
}
function b64(n) { const C = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'; let s = ''; for (let i = 0; i < n; i++) s += C[i & 63]; return s; }
async function tf(label, bodyStr) {
  const t = Date.now();
  try {
    const r = await fetch(API + '/asr', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: bodyStr });
    const tx = await r.text();
    w(label + ' -> HTTP ' + r.status + ' ' + (Date.now() - t) + 'ms', r.status < 500 ? 'ok' : 'dim');
    return true;
  } catch (e) {
    w(label + ' -> ❌FAIL ' + e.name + ' ' + (Date.now() - t) + 'ms ' + e.message, 'bad');
    return false;
  }
}
function xf(label, bodyStr) {
  return new Promise(function (resolve) {
    const t = Date.now();
    try {
      const x = new XMLHttpRequest();
      x.open('POST', API + '/asr', true);
      x.setRequestHeader('Content-Type', 'application/json');
      x.onload = function () { w(label + ' -> HTTP ' + x.status + ' ' + (Date.now() - t) + 'ms', 'ok'); resolve(true); };
      x.onerror = function () { w(label + ' -> ❌XHR ERROR ' + (Date.now() - t) + 'ms', 'bad'); resolve(false); };
      x.send(bodyStr);
    } catch (e) { w(label + ' -> ❌XHR THROW ' + e.name + ' ' + e.message, 'bad'); resolve(false); }
  });
}
(async function () {
  w('origin=' + location.origin.slice(0, 60), 'dim');
  const sizes = [64, 128, 160, 192, 224, 256, 288, 320];
  let lastOK = 0, firstFail = 0;
  for (let i = 0; i < sizes.length; i++) {
    const kb = sizes[i];
    const okr = await tf('[' + kb + 'KB fetch]', JSON.stringify({ audio_base64: b64(kb * 1024), format: 'wav' }));
    if (okr) { if (!firstFail) lastOK = kb; } else { if (!firstFail) firstFail = kb; }
  }
  await xf('[153KB xhr  ]', JSON.stringify({ audio_base64: b64(153 * 1024), format: 'wav' }));
  /* 正式页同款：带 signal 的 288KB */
  const sig = await new Promise(function (resolve) {
    const t = Date.now();
    const ctl = new AbortController();
    setTimeout(function () { ctl.abort(); }, 45000);
    fetch(API + '/asr', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ audio_base64: b64(288 * 1024), format: 'wav', duration_ms: 7000, sample_rate: 16000 }),
      signal: ctl.signal,
    }).then(function (r) { w('[288KB signal正式页同款] -> HTTP ' + r.status + ' ' + (Date.now() - t) + 'ms', r.status < 500 ? 'ok' : 'dim'); resolve(); })
      .catch(function (e) { w('[288KB signal正式页同款] -> ❌' + e.name + ' ' + (Date.now() - t) + 'ms ' + e.message, 'bad'); resolve(); });
  });
  let v;
  if (!firstFail) v = 'RESULT: ALL-PASS（' + lastOK + 'KB 为最大通过档）';
  else if (lastOK) v = 'RESULT: 阈值锁定！' + lastOK + 'KB 通过 / ' + firstFail + 'KB 失败 —— 体积超限实锤';
  else v = 'RESULT: 64KB 都失败（与体积无关，另查）';
  document.getElementById('v').textContent = v;
  document.title = v;
  const big = document.createElement('div');
  big.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99;background:#000;color:#0f0;font:700 14px monospace;padding:6px 10px';
  big.textContent = v;
  document.body.appendChild(big);
})();
</script>
</body>
</html>
